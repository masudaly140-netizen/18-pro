workflows:
  android-build:
    name: Camera 18 Pro Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          gradle --version
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
